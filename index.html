<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Central de Atualizações — Portal BI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0d1117;
  color:#e6edf3;
  font-family:Arial, sans-serif;
}
.header{
  padding:22px 28px;
  border-bottom:1px solid #26303b;
}
.header h1{margin:0;font-size:22px}
.header p{margin:4px 0 0;color:#8b949e}
.wrap{padding:28px}
.box{
  background:#161b22;
  border:1px solid #26303b;
  border-radius:12px;
  padding:16px;
  margin-bottom:18px;
}
.alert{
  background:#2d1117;
  border:1px solid #8b2c2c;
  color:#ff8585;
}
.alert.ok{
  background:#10281a;
  border-color:#2ea043;
  color:#54d36a;
}
button,select{
  background:#0b1220;
  color:#e6edf3;
  border:1px solid #26303b;
  border-radius:8px;
  padding:10px 14px;
  font-weight:bold;
}
button{
  cursor:pointer;
}
button.primary{
  background:#c0392b;
  border-color:#c0392b;
  color:white;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.toolbar{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap;
}
label{
  display:block;
  color:#8b949e;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#161b22;
  border-radius:12px;
  overflow:hidden;
}
th{
  background:#1d2633;
  color:#8b949e;
  text-align:left;
  padding:13px;
  font-size:12px;
}
td{
  border-top:1px solid #26303b;
  padding:13px;
  font-size:13px;
}
.nome{
  font-weight:bold;
}
.arquivo{
  color:#8b949e;
  font-size:12px;
  margin-top:3px;
}
.badge{
  padding:4px 10px;
  border-radius:99px;
  font-weight:bold;
  font-size:12px;
  white-space:nowrap;
}
.sucesso{background:#12351d;color:#54d36a}
.erro{background:#3a1111;color:#ff8585}
.executando{background:#3b2b0a;color:#f0b429}
.aguardando{background:#222b35;color:#a6b0bb}
.link{
  background:transparent;
  border:0;
  color:#ff776d;
}
.progress{
  height:10px;
  background:#0b1220;
  border-radius:999px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:#c0392b;
  transition:width .25s;
}
.terminal{
  background:#020617;
  border:1px solid #26303b;
  border-radius:12px;
  padding:16px;
  height:280px;
  overflow:auto;
  white-space:pre-wrap;
  font-family:Consolas, monospace;
  font-size:12px;
  color:#cde3ff;
}
.table-wrap{
  overflow-x:auto;
}
@media(max-width:900px){
  .wrap{padding:14px}
  table{min-width:900px}
}
</style>
</head>
<body>

<div class="header">
  <h1>Central de Atualizações</h1>
  <p>Atualização dos relatórios Power BI</p>
</div>

<div class="wrap">

  <div id="apiBox" class="box alert">
    Verificando API...
  </div>

  <div class="box toolbar">
    <div>
      <label>Período</label>
      <select id="periodo">
        <option value="hoje">Hoje</option>
        <option value="2_dias">Últimos 2 dias</option>
        <option value="5_dias" selected>Últimos 5 dias</option>
        <option value="7_dias">Últimos 7 dias</option>
      </select>
    </div>

    <button class="primary" id="btnTudo">▶ Atualizar tudo Logística</button>
    <div id="execInfo" style="margin-left:auto;color:#8b949e;font-size:12px;">
      Aguardando...
    </div>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;color:#8b949e;font-size:12px;">
      <span id="progressText">Nenhuma execução em andamento</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress">
      <div id="progressBar" class="bar"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Relatório</th>
          <th>Status</th>
          <th>Última atualização</th>
          <th>Duração</th>
          <th>Período / Dados</th>
          <th>Arquivos</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="box" style="margin-top:18px;">
    <h3>Terminal</h3>
    <div id="terminal" class="terminal">Aguardando...</div>
  </div>

  <div class="box">
    <h3>Histórico</h3>
    <div id="historico">Aguardando...</div>
  </div>

</div>

<script>
/*
  IMPORTANTE:
  Como o portal será aberto pelo GitHub,
  a API precisa ficar fixa no computador que executa os robôs.
*/
const API = "http://192.168.1.193:5000";

let statusAtual = null;

function badge(status){
  const s = String(status || "Aguardando").toLowerCase();

  if(s.includes("sucesso")){
    return '<span class="badge sucesso">● Sucesso</span>';
  }

  if(s.includes("erro")){
    return '<span class="badge erro">● Erro</span>';
  }

  if(s.includes("atualizando")){
    return '<span class="badge executando">● Atualizando</span>';
  }

  if(s.includes("em andamento")){
    return '<span class="badge executando">● Em andamento</span>';
  }

  if(s.includes("executando")){
    return '<span class="badge executando">● Executando</span>';
  }

  return '<span class="badge aguardando">● Aguardando</span>';
}

async function chamarApi(caminho, opcoes={}){
  const resp = await fetch(API + caminho, {
    headers: {"Content-Type":"application/json"},
    ...opcoes
  });

  if(!resp.ok){
    throw new Error(await resp.text());
  }

  return await resp.json();
}

async function carregarStatus(){
  try{
    const data = await chamarApi("/api/status");
    statusAtual = data;

    const apiBox = document.getElementById("apiBox");
    apiBox.className = "box alert ok";
    apiBox.innerHTML = "● API conectada — " + API;

    desenhar(data);

  }catch(e){
    const apiBox = document.getElementById("apiBox");
    apiBox.className = "box alert";
    apiBox.innerHTML = "✖ API desconectada — " + API + "<br><small>Verifique se a API está aberta no computador 192.168.1.193.</small>";
  }
}

async function carregarLogs(){
  try{
    const data = await chamarApi("/api/logs");
    const terminal = document.getElementById("terminal");
    terminal.textContent = data.logs || "Aguardando...";
    terminal.scrollTop = terminal.scrollHeight;
  }catch(e){
    document.getElementById("terminal").textContent = "Não foi possível carregar logs. Verifique se a API está conectada.";
  }
}

function desenhar(data){
  const exec = data.execucao || {};
  const relatorios = Object.values(data.relatorios || {});
  const tbody = document.getElementById("tbody");

  tbody.innerHTML = "";

  relatorios.forEach(r => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <div class="nome">${r.nome}</div>
        <div class="arquivo">${(r.arquivo || "").split("\\").pop()}</div>
        ${r.erro ? `<div class="arquivo" style="color:#ff8585;">Erro: ${r.erro}</div>` : ""}
      </td>
      <td>${badge(r.status)}</td>
      <td>${r.ultima || "—"}</td>
      <td>${r.duracao || "—"}</td>
      <td>
        ${r.periodo || "—"}
        ${r.ultima_data_arquivo ? `<div class="arquivo">Última data: ${r.ultima_data_arquivo}</div>` : ""}
      </td>
      <td>${r.total_arquivos || 0}</td>
      <td><button class="link" data-id="${r.id}">Atualizar</button></td>
    `;

    tbody.appendChild(tr);
  });

  const rodando = exec.status === "executando";
  const concluidos = exec.concluidos || [];
  const total = relatorios.length || 1;
  const pct = rodando ? Math.round((concluidos.length / total) * 100) : 0;

  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "%";

  document.getElementById("progressText").textContent =
    rodando
      ? "Executando: " + (exec.etapa_atual || "")
      : exec.status === "erro"
        ? "Erro: " + (exec.erro || "")
        : "Nenhuma execução em andamento";

  document.getElementById("execInfo").textContent =
    "Status: " + (exec.status || "aguardando");

  document.getElementById("btnTudo").disabled = rodando;
  document.querySelectorAll("button[data-id]").forEach(btn => {
    btn.disabled = rodando;
  });


  desenharHistorico(data.historico || []);
}

function desenharHistorico(lista){
  const div = document.getElementById("historico");

  if(!lista.length){
    div.innerHTML = '<div style="color:#8b949e;font-size:13px;">Nenhum histórico ainda.</div>';
    return;
  }

  div.innerHTML = lista.slice(0,15).map(h => `
    <div style="border-top:1px solid #26303b;padding:10px 0;color:#8b949e;font-size:13px;">
      <b>${h.status === "Sucesso" ? "✅" : "❌"} ${h.data}</b>
      — ${h.nome}
      — ${h.duracao || ""}
      ${h.erro ? `<br><span style="color:#ff8585;">${h.erro}</span>` : ""}
    </div>
  `).join("");
}

async function atualizarTudo(){
  const periodo = document.getElementById("periodo").value;

  if(!confirm("Atualizar tudo Logística?")){
    return;
  }

  try{
    await chamarApi("/api/executar/logistica", {
      method:"POST",
      body:JSON.stringify({periodo})
    });

    carregarStatus();
  }catch(e){
    alert("Erro: " + e.message);
  }
}

async function atualizarRelatorio(id){
  const periodo = document.getElementById("periodo").value;
  const nome = statusAtual?.relatorios?.[id]?.nome || id;

  if(!confirm("Atualizar " + nome + "?")){
    return;
  }

  try{
    await chamarApi("/api/executar/relatorio", {
      method:"POST",
      body:JSON.stringify({id, periodo})
    });

    carregarStatus();
  }catch(e){
    alert("Erro: " + e.message);
  }
}

document.getElementById("btnTudo").addEventListener("click", atualizarTudo);

document.getElementById("tbody").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-id]");
  if(!btn){
    return;
  }
  atualizarRelatorio(btn.dataset.id);
});

carregarStatus();
carregarLogs();

setInterval(carregarStatus, 2000);
setInterval(carregarLogs, 2000);
</script>

</body>
</html>
